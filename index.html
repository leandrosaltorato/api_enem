<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banco de Questões ENEM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <div class="brand">
          <h1>Banco de Questões ENEM</h1>
          <p>Provas anteriores com gabarito</p>
        </div>
        <div class="filters">
          <div class="field">
            <label for="year">Prova</label
            ><select id="year">
              <option>Carregando…</option>
            </select>
          </div>
          <div class="field">
            <label for="discipline">Área</label
            ><select id="discipline">
              <option value="">Todas as áreas</option>
            </select>
          </div>
          <div class="field">
            <label for="language">Idioma estrangeiro</label
            ><select id="language">
              <option value="">Todos</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section aria-live="polite">
        <p class="status" id="status"></p>
        <div id="banner"></div>
        <div id="list"></div>
        <nav class="pager" id="pager" aria-label="Paginação"></nav>
      </section>

      <aside class="sheet" aria-label="Cartão-resposta">
        <h2>Cartão-resposta</h2>
        <p class="score" id="score">0 respondidas · 0 acertos</p>
        <div class="grid" id="grid"></div>
        <div class="legend">
          <span><i style="background: var(--ok)"></i>Acerto</span>
          <span><i style="background: var(--bad)"></i>Erro</span>
          <span
            ><i
              style="
                background: var(--blue-soft);
                border: 1px solid var(--blue);
              "
            ></i
            >Gabarito visto</span
          >
        </div>
        <div class="actions">
          <button class="btn light" id="reset" type="button">
            Limpar respostas desta prova
          </button>
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
